name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: wayline, POSTGRES_PASSWORD: wayline, POSTGRES_DB: wayline_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wayline" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://wayline:wayline@localhost:5432/wayline_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Real Valhalla on a synthetic street grid
        run: scripts/valhalla-test.sh --daemon
      - run: npm run test:integration
        env: { VALHALLA_URL: "http://127.0.0.1:8002" }
      - name: Traffic worker tests (unit + Valhalla/Redis/Postgres integration)
        working-directory: apps/traffic-worker
        run: |
          pip install -q -e '.[dev]'
          pytest -q
        env: { VALHALLA_URL: "http://127.0.0.1:8002", REDIS_URL: "redis://localhost:6379/14" }
      - run: npm run build
      - name: OpenAPI contract is up to date
        run: |
          npm run openapi
          git diff --exit-code -- openapi.yaml packages/contracts/src/schema.ts \
            || (echo "::error::API changed — run 'npm run openapi' and commit the result" && exit 1)

  mobile:
    runs-on: ubuntu-latest
    env: { EXPO_NO_TELEMETRY: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -w @wayline/navigation-core
      - run: npm test -w @wayline/mobile
      - run: npm run typecheck -w @wayline/mobile
      - run: npm run lint -w @wayline/mobile
      - name: JS bundles build for both platforms
        run: npm run bundle:check -w @wayline/mobile
      - name: Expo dependency check
        run: npx expo-doctor
        working-directory: apps/mobile
        continue-on-error: true

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/wayline-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: apps/traffic-worker
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/wayline-traffic-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
