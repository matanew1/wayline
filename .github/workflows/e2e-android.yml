name: e2e-android

# Maestro device tests on an Android emulator: builds a development-variant APK (JS bundled in,
# so no Metro), starts the API with memory drivers, and runs apps/mobile/.maestro.
# Runs on PRs that touch the app, nightly, and on demand — a full native build takes ~20–30 minutes.
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/mobile/**", "packages/navigation-core/**", "packages/react-native-carplay/**", ".github/workflows/e2e-android.yml"]
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
      APP_VARIANT: development
      # the emulator reaches the host at 10.0.2.2
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm ci

      - name: Build APK (release build type, debug-signed, development variant)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Start API (memory drivers, review sign-in)
        run: |
          npm run build
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health/live && break; sleep 1; done
        env:
          NODE_ENV: development
          PORT: "3000"
          STORE_DRIVER: memory
          ROUTING_DRIVER: mock
          GEOCODER_DRIVER: memory
          SMS_DRIVER: log
          REVIEW_PHONE: "+972500000001"
          REVIEW_CODE: "246810"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            cd apps/mobile && maestro test .maestro --format junit --output ../../maestro-report.xml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: |
            maestro-report.xml
            api.log
            ~/.maestro/tests/
          if-no-files-found: ignore
