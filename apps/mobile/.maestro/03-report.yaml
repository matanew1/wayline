# Report a hazard from the home screen; the report sheet closes and a confirmation shows.
appId: com.wayline.app.dev
name: Report a hazard
tags: [smoke, reports]
---
- runFlow: subflows/launch.yaml
- tapOn:
    id: report-open
- assertVisible:
    id: report-police
- tapOn:
    id: report-hazard
# the API accepted it: confirmation toast (shown ~2.4 s)
- extendedWaitUntil:
    visible: ".*(reported|confirmed) — thanks!"
    timeout: 10000
# the sheet is a sliding modal; wait for it to finish closing
- extendedWaitUntil:
    visible:
      id: where-to
    timeout: 10000
