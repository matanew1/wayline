# Store requirement: in-app account deletion. Signs in, deletes, and lands back as a guest.
appId: com.wayline.app.dev
name: Delete account
tags: [account, store]
env:
  PHONE: "+972500000001"
  CODE: "246810"
---
- runFlow:
    file: 05-sign-in.yaml
    env:
      PHONE: ${PHONE}
      CODE: ${CODE}
- tapOn:
    id: delete-account
- assertVisible: "Delete your account?"
- tapOn: "(?i)^delete$"   # the dialog's confirm button (Android may render it upper-case)
# deleting closes the account screen; reopening it shows the sign-in form of a fresh guest
- extendedWaitUntil:
    visible:
      id: open-account
    timeout: 15000
- tapOn:
    id: open-account
- extendedWaitUntil:
    visible:
      id: phone-input
    timeout: 10000
- assertNotVisible:
    id: sign-out
