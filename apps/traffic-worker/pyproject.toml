[project]
name = "wayline-traffic-worker"
version = "0.1.0"
description = "Turns anonymised GPS probes into live per-edge road speeds for Wayline"
requires-python = ">=3.12"
dependencies = [
  "aiokafka==0.14.0",
  "redis==8.1.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
wayline-traffic-worker = "wayline_traffic.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wayline_traffic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
