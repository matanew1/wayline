# Local stack.
#   npm run infra:up                         → postgres, redis, redpanda (enough for STORE_DRIVER=infra)
#   docker compose --profile routing up -d   → + Valhalla (first start builds Israel tiles, ~10–20 min)
#   docker compose --profile app up -d --build → + the API and traffic worker containers
#   docker compose --profile geocoder up -d      → + self-hosted Photon (Israel extract; first start downloads data)
#   docker compose --profile observability up -d → + Jaeger (traces, :16686) and Prometheus (:9090)
#   docker compose --profile tiles up -d         → + Martin serving our basemap (build it first:
#                                                    infra/map-data/build.sh --out map-data-out)
name: wayline

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wayline
      POSTGRES_PASSWORD: wayline
      POSTGRES_DB: wayline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayline"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      retries: 20

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on: { redpanda: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk -X brokers=redpanda:9092 topic create probes.raw -p 12 -c retention.ms=604800000 || true;
        rpk -X brokers=redpanda:9092 topic create reports.events -p 6 || true;
        rpk -X brokers=redpanda:9092 topic create traffic.edges -p 12 -c cleanup.policy=compact || true
    restart: "no"

  valhalla:
    profiles: ["routing"]
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    environment:
      tile_urls: https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
    ports: ["8002:8002"]
    volumes: ["./valhalla_data:/custom_files"]

  photon:
    profiles: ["geocoder"]
    # Community-maintained Photon image; downloads a prebuilt country index on first start.
    image: rtuszik/photon-docker:2.4.0
    environment:
      REGION: il
      LANGUAGES: he,en
      UPDATE_STRATEGY: SEQUENTIAL
    ports: ["2322:2322"]
    volumes: ["photon_data:/photon/data"]

  tiles:
    profiles: ["tiles"]
    image: ghcr.io/maplibre/martin:1.16.1
    # serves map-data-out/israel.pmtiles as /israel (TileJSON) and /israel/{z}/{x}/{y}
    command: ["/data/israel.pmtiles"]
    volumes: ["./map-data-out:/data:ro"]
    ports: ["3100:3000"]

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  traffic-worker:
    profiles: ["app"]
    build: { context: apps/traffic-worker }
    depends_on:
      redis: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_URL: redis://redis:6379
      VALHALLA_URL: http://valhalla:8002
      DATABASE_URL: postgresql://wayline:wayline@postgres:5432/wayline
    ports: ["9464:9464"]

  api:
    profiles: ["app"]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORE_DRIVER: infra
      ROUTING_DRIVER: valhalla
      GEOCODER_DRIVER: photon
      # self-hosted with --profile geocoder; the public instance is for light development use only
      GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
      SMS_DRIVER: ${SMS_DRIVER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # with --profile tiles: the app's map style points at our own basemap
      MAP_TILES_URL: ${MAP_TILES_URL:-}
      DATABASE_URL: postgres://wayline:wayline@postgres:5432/wayline
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      VALHALLA_URL: http://valhalla:8002
      JWT_SECRET: local-compose-secret-change-me-0123456789
      PHONE_PEPPER: local-compose-pepper-0123
      OTP_DEV_ECHO: "false"
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/main.js"]
    ports: ["3000:3000"]

volumes:
  pgdata:
  photon_data:
