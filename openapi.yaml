openapi: 3.0.0
paths:
  /health/live:
    get:
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - health
  /health:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDto'
      tags:
        - health
  /v1/auth/otp:
    post:
      operationId: AuthController_requestOtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestedDto'
      tags:
        - auth
  /v1/auth/verify:
    post:
      operationId: AuthController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
      tags:
        - auth
  /v1/auth/guest:
    post:
      operationId: AuthController_guest
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
      tags:
        - auth
  /v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
      tags:
        - auth
  /v1/places/search:
    get:
      operationId: PlacesController_search
      parameters:
        - name: q
          required: true
          in: query
          schema:
            example: city hall
            type: string
        - name: lat
          required: false
          in: query
          description: Bias results near this point
          schema:
            type: number
        - name: lng
          required: false
          in: query
          schema:
            type: number
        - name: lang
          required: false
          in: query
          schema:
            default: en
            type: string
            enum:
              - he
              - en
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceDto'
      security:
        - bearer: []
      tags:
        - places
  /v1/me/places:
    get:
      operationId: PlacesController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedPlaceDto'
      security:
        - bearer: []
      tags:
        - places
    put:
      operationId: PlacesController_save
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaceDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlaceDto'
      security:
        - bearer: []
      tags:
        - places
  /v1/me/places/{id}:
    delete:
      operationId: PlacesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      tags:
        - places
  /v1/routes:
    post:
      operationId: RoutingController_plan
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequestDto'
      responses:
        '200':
          description: Best route first, up to 3
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteOptionDto'
        '404':
          description: No route between the points
      security:
        - bearer: []
      tags:
        - routes
  /v1/routes/{id}/departures:
    get:
      operationId: RoutingController_departures
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: offsets
          required: false
          in: query
          description: Minutes from now, comma-separated (0–180, up to 6)
          schema:
            example: 0,15,30
            type: string
      responses:
        '200':
          description: Drive time for this route when leaving now or later
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartureDto'
        '404':
          description: Route expired
      security:
        - bearer: []
      tags:
        - routes
  /v1/trips:
    post:
      operationId: TripsController_start
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTripDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripStartedDto'
      security:
        - bearer: []
      tags:
        - trips
  /v1/trips/{id}:
    patch:
      operationId: TripsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDto'
      security:
        - bearer: []
      tags:
        - trips
  /v1/trips/{id}/eta:
    post:
      operationId: TripsController_eta
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtaRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtaDto'
      security:
        - bearer: []
      tags:
        - trips
  /v1/trips/{id}/share:
    post:
      operationId: TripsController_share
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareTripDto'
      responses:
        '201':
          description: A link that shows your live arrival time (not your location). Same link if already shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripShareDto'
      security:
        - bearer: []
      tags:
        - trips
    delete:
      operationId: TripsController_unshare
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      tags:
        - trips
  /v1/probes:
    post:
      operationId: TripsController_probes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeBatchDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbesAcceptedDto'
      tags:
        - trips
  /v1/share/{token}:
    get:
      operationId: ShareController_json
      parameters:
        - name: token
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedTripDto'
        '404':
          description: Unknown or expired link
      tags:
        - trips
  /v1/reports:
    post:
      operationId: ReportsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreatedDto'
      security:
        - bearer: []
      tags:
        - reports
  /v1/reports/{id}/votes:
    post:
      operationId: ReportsController_vote
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResultDto'
      security:
        - bearer: []
      tags:
        - reports
  /v1/reports/nearby:
    get:
      operationId: ReportsController_nearby
      parameters:
        - name: lat
          required: true
          in: query
          schema:
            type: number
        - name: lng
          required: true
          in: query
          schema:
            type: number
        - name: radiusM
          required: false
          in: query
          schema:
            maximum: 20000
            default: 5000
            type: number
      responses:
        '200':
          description: Initial load; live updates come over the realtime gateway
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportDto'
      security:
        - bearer: []
      tags:
        - reports
  /v1/me:
    get:
      operationId: AccountController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags:
        - account
    patch:
      operationId: AccountController_update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags:
        - account
    delete:
      operationId: AccountController_remove
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      tags:
        - account
  /v1/me/trips:
    get:
      operationId: AccountController_recentTrips
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            maximum: 50
            default: 10
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentTripDto'
      security:
        - bearer: []
      tags:
        - account
info:
  title: Wayline API
  description: 'Community-powered navigation. Realtime events: Socket.IO namespace /rt (see RealtimeGateway).'
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    HealthDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        storeDriver:
          type: string
        routingDriver:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
      required:
        - status
        - storeDriver
        - routingDriver
        - checks
    RequestOtpDto:
      type: object
      properties:
        phone:
          type: string
          example: '+972501234567'
          description: E.164 phone number
      required:
        - phone
    OtpRequestedDto:
      type: object
      properties:
        sentTo:
          type: string
          example: +97250•••4567
        expiresInS:
          type: number
          example: 300
        devCode:
          type: string
          description: Only when OTP_DEV_ECHO=true (never in production)
      required:
        - sentTo
        - expiresInS
    VerifyOtpDto:
      type: object
      properties:
        phone:
          type: string
          example: '+972501234567'
          description: E.164 phone number
        code:
          type: string
          example: '123456'
      required:
        - phone
        - code
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInS:
          type: number
          example: 900
        userId:
          type: string
        guest:
          type: boolean
      required:
        - accessToken
        - refreshToken
        - expiresInS
        - userId
        - guest
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    PlaceDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        distanceM:
          type: number
          description: Straight-line distance from the bias point
      required:
        - id
        - name
        - address
        - lat
        - lng
    SavedPlaceDto:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - home
            - work
            - fav
        name:
          type: string
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - id
        - kind
        - name
        - lat
        - lng
    SavePlaceDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - home
            - work
            - fav
        name:
          type: string
          example: Work
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - kind
        - name
        - lat
        - lng
    LatLngDto:
      type: object
      properties:
        lat:
          type: number
          example: 32.0853
        lng:
          type: number
          example: 34.7818
      required:
        - lat
        - lng
    RouteRequestDto:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/LatLngDto'
        destination:
          $ref: '#/components/schemas/LatLngDto'
        avoid:
          type: array
          items:
            type: string
            enum:
              - tolls
              - highways
              - ferries
        language:
          type: string
          enum:
            - he
            - en
          default: en
          description: Language of maneuver instructions
        vehicle:
          type: string
          enum:
            - car
            - motorcycle
          default: car
      required:
        - origin
        - destination
    LaneDto:
      type: object
      properties:
        indications:
          type: array
          description: Arrows painted on this lane, left to right order of lanes
          items:
            type: string
            enum:
              - left
              - slight left
              - sharp left
              - straight
              - right
              - slight right
              - sharp right
              - uturn
              - none
        valid:
          type: boolean
          description: This lane can be used for the maneuver
      required:
        - indications
        - valid
    ManeuverDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - depart
            - arrive
            - continue
            - slight_right
            - right
            - sharp_right
            - uturn
            - sharp_left
            - left
            - slight_left
            - ramp
            - exit
            - keep_right
            - keep_left
            - merge
            - roundabout
            - ferry
        instruction:
          type: string
          example: Turn right onto Jabotinsky Street.
        streetNames:
          type: array
          items:
            type: string
        distanceM:
          type: number
          description: Length of this maneuver segment
        durationS:
          type: number
        beginShapeIndex:
          type: number
          description: Index into the decoded polyline where this maneuver starts
        lanes:
          description: Lanes before this maneuver, left to right, when the map has turn lanes
          type: array
          items:
            $ref: '#/components/schemas/LaneDto'
      required:
        - kind
        - instruction
        - streetNames
        - distanceM
        - durationS
        - beginShapeIndex
    SpeedLimitSpanDto:
      type: object
      properties:
        fromM:
          type: number
          description: metres along the route
        toM:
          type: number
        kmh:
          type: number
      required:
        - fromM
        - toM
        - kmh
    CongestionSpanDto:
      type: object
      properties:
        fromM:
          type: number
        toM:
          type: number
        level:
          type: string
          enum:
            - slow
            - jam
      required:
        - fromM
        - toM
        - level
    RouteTrafficDto:
      type: object
      properties:
        baseDurationS:
          type: number
          description: Duration without live traffic
        liveEdges:
          type: number
          description: Edges priced with live speeds
        totalEdges:
          type: number
        congestion:
          type: array
          items:
            $ref: '#/components/schemas/CongestionSpanDto'
      required:
        - baseDurationS
        - liveEdges
        - totalEdges
        - congestion
    RouteOptionDto:
      type: object
      properties:
        id:
          type: string
          description: Pass to POST /trips; valid for 30 minutes
        polyline6:
          type: string
          description: Encoded polyline, precision 6
        durationS:
          type: number
        distanceM:
          type: number
        maneuvers:
          type: array
          items:
            $ref: '#/components/schemas/ManeuverDto'
        flags:
          type: array
          items:
            type: string
            enum:
              - toll
              - highway
              - ferry
        cells:
          description: Geohash-6 cells to subscribe to on the realtime gateway
          type: array
          items:
            type: string
        speedLimits:
          description: Posted limits along the route (gaps = unknown)
          type: array
          items:
            $ref: '#/components/schemas/SpeedLimitSpanDto'
        traffic:
          nullable: true
          description: null when edge data was unavailable
          allOf:
            - $ref: '#/components/schemas/RouteTrafficDto'
      required:
        - id
        - polyline6
        - durationS
        - distanceM
        - maneuvers
        - flags
        - cells
        - speedLimits
        - traffic
    DepartureDto:
      type: object
      properties:
        offsetMin:
          type: number
          description: Minutes from now
        departAt:
          type: string
        durationS:
          type: number
          description: Expected drive time if leaving then
        basis:
          type: string
          enum:
            - live
            - historic
            - typical
          description: >-
            live = current traffic; historic = usual speeds for that hour of the week; typical = no traffic data, router
            estimate
      required:
        - offsetMin
        - departAt
        - durationS
        - basis
    StartTripDto:
      type: object
      properties:
        routeId:
          type: string
          description: Route id from POST /routes
        destinationName:
          type: string
          description: Destination as the driver picked it — shown in recent drives and on ETA share links
          maxLength: 120
      required:
        - routeId
    TripStartedDto:
      type: object
      properties:
        tripId:
          type: string
        probeToken:
          type: string
          description: Credential for POST /probes. Not linked to the user in the probe stream.
        probeTokenExpiresInS:
          type: number
        startedAt:
          type: string
      required:
        - tripId
        - probeToken
        - probeTokenExpiresInS
        - startedAt
    UpdateTripDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - finished
            - cancelled
        routeId:
          type: string
          description: New route id after a reroute
    TripDto:
      type: object
      properties:
        id:
          type: string
        routeId:
          type: string
        status:
          type: string
          enum:
            - active
            - finished
            - cancelled
        distanceM:
          type: number
        startedAt:
          type: string
        endedAt:
          type: string
      required:
        - id
        - routeId
        - status
        - distanceM
        - startedAt
    EtaRequestDto:
      type: object
      properties:
        lat:
          type: number
          description: Current position. Used for this calculation only — not stored.
        lng:
          type: number
      required:
        - lat
        - lng
    EtaDto:
      type: object
      properties:
        remainingS:
          type: number
          description: Traffic-adjusted time left on the current route
        offRouteM:
          type: number
          description: Distance from the route; large values mean the driver is off route
        liveEdges:
          type: number
        fasterRoute:
          description: Present when a route at least FASTER_ROUTE_MIN_SAVING_S faster exists
          allOf:
            - $ref: '#/components/schemas/RouteOptionDto'
        savingS:
          type: number
      required:
        - remainingS
        - offRouteM
        - liveEdges
    ShareTripDto:
      type: object
      properties:
        remainingS:
          type: number
          description: Current remaining seconds from the app, to seed the page until the next ETA check
    TripShareDto:
      type: object
      properties:
        token:
          type: string
        url:
          type: string
          description: Public page with the live ETA
        expiresAt:
          type: string
      required:
        - token
        - url
        - expiresAt
    ProbeFixDto:
      type: object
      properties:
        t:
          type: number
          description: Unix epoch milliseconds
        lat:
          type: number
        lng:
          type: number
        speed:
          type: number
          description: m/s
        heading:
          type: number
          description: degrees, 0 = north
        acc:
          type: number
          description: horizontal accuracy, metres
      required:
        - t
        - lat
        - lng
    ProbeBatchDto:
      type: object
      properties:
        probeToken:
          type: string
        fixes:
          description: 1–600 fixes (10 min at 1 Hz)
          type: array
          items:
            $ref: '#/components/schemas/ProbeFixDto'
      required:
        - probeToken
        - fixes
    ProbesAcceptedDto:
      type: object
      properties:
        accepted:
          type: number
        dropped:
          type: number
          description: Fixes dropped for poor accuracy or bad timestamps
      required:
        - accepted
        - dropped
    SharedTripDto:
      type: object
      properties:
        driverName:
          type: string
        destinationName:
          type: object
          nullable: true
        status:
          type: string
          enum:
            - driving
            - arrived
            - ended
        etaEpochMs:
          type: number
          description: Expected arrival, epoch ms
        updatedAt:
          type: string
      required:
        - driverName
        - destinationName
        - status
        - etaEpochMs
        - updatedAt
    CreateReportDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - traffic
            - police
            - crash
            - hazard
            - closure
            - camera
        lat:
          type: number
        lng:
          type: number
        heading:
          type: number
          description: Reporter direction of travel, degrees
        clientId:
          type: string
          description: Client-generated id; retries with the same id are idempotent
      required:
        - type
        - lat
        - lng
        - clientId
    ReportDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - traffic
            - police
            - crash
            - hazard
            - closure
            - camera
        lat:
          type: number
        lng:
          type: number
        heading:
          type: number
          nullable: true
        confidence:
          type: number
          description: 0–1
        createdAt:
          type: string
        expiresAt:
          type: string
      required:
        - id
        - type
        - lat
        - lng
        - heading
        - confidence
        - createdAt
        - expiresAt
    ReportCreatedDto:
      type: object
      properties:
        id:
          type: string
        merged:
          type: boolean
          description: true when the report was merged into an existing nearby one
        report:
          $ref: '#/components/schemas/ReportDto'
      required:
        - id
        - merged
        - report
    VoteDto:
      type: object
      properties:
        stillThere:
          type: boolean
      required:
        - stillThere
    VoteResultDto:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - expired
        confidence:
          type: number
        expiresAt:
          type: string
      required:
        - id
        - status
        - confidence
        - expiresAt
    ReputationDto:
      type: object
      properties:
        level:
          type: string
          enum:
            - new
            - helper
            - trusted
            - legend
        progress:
          type: number
          description: 0–1 progress to the next level
        next:
          type: string
          enum:
            - new
            - helper
            - trusted
            - legend
          nullable: true
      required:
        - level
        - progress
        - next
    StatsDto:
      type: object
      properties:
        drives:
          type: number
          description: Finished drives
        distanceM:
          type: number
        reports:
          type: number
          description: Reports you made
        confirmations:
          type: number
          description: '"Still there" votes other drivers gave your reports'
      required:
        - drives
        - distanceM
        - reports
        - confirmations
    MeDto:
      type: object
      properties:
        id:
          type: string
        guest:
          type: boolean
        nickname:
          type: string
          description: Shown on your profile; a default is generated until you pick one
        nicknameIsDefault:
          type: boolean
          description: True when nickname is the generated default
        trustScore:
          type: number
          description: 0–1; seeds the confidence of your reports
        reputation:
          $ref: '#/components/schemas/ReputationDto'
        stats:
          $ref: '#/components/schemas/StatsDto'
        createdAt:
          type: string
      required:
        - id
        - guest
        - nickname
        - nicknameIsDefault
        - trustScore
        - reputation
        - stats
        - createdAt
    UpdateMeDto:
      type: object
      properties:
        nickname:
          type: string
          description: 2–24 letters, digits, spaces, . _ -; empty string resets to the default
          example: Night Owl
    RecentTripDto:
      type: object
      properties:
        id:
          type: string
        destinationName:
          type: object
          nullable: true
        distanceM:
          type: number
        startedAt:
          type: string
        endedAt:
          type: string
      required:
        - id
        - destinationName
        - distanceM
        - startedAt
