// Wayline vendoring: no buildscript of its own — AGP and Kotlin come from the app's root project
// (React Native 0.88 template), so versions can't clash with the app's.
apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// No codegen specs in this library (it's a legacy-interop native module), so the
// com.facebook.react plugin isn't applied.

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Carplay_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Carplay_" + name]).toInteger()
}

android {
  namespace "org.birkir.carplay"

  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifest.xml"
      java.srcDirs = ["src/main/java"]
      res.srcDirs = ["src/main/res"]
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  buildFeatures {
    buildConfig = true
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "float", "CARPLAY_SCALE_FACTOR", "1.5f"
    buildConfigField "long", "CARPLAY_CLUSTER_SPLASH_DELAY_MS", "1000"
    buildConfigField "long", "CARPLAY_CLUSTER_SPLASH_DURATION_MS", "500"
    buildConfigField "long", "CARPLAY_TELEMETRY_INTERVAL_MS", "4000"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

}

repositories {
  mavenLocal()
  mavenCentral()
  google()
}

dependencies {
  // the app's React Native version (resolved by the RN Gradle plugin) — was pinned to 0.76.9 upstream
  compileOnly "com.facebook.react:react-android"
  implementation 'com.google.android.gms:play-services-base:18.3.0'
  implementation 'com.google.android.gms:play-services-auth:21.0.0'
  implementation "androidx.car.app:app:1.7.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"
}

